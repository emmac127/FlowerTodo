  acorn_bird:
    name: Acorn bird
    mode: birdAmbient
    scaleWithStage: false
    unlockImage: /garden/assets/Birds/acorn1.png
    behavior:
      hopIntervalSec: { min: 15, max: 60 }
      wingflapChance: 0.35
      peckChance: 0
      flyChance: 0.3
      idleFrame: 0
    animations:
      idle:
        frames:
          - /garden/assets/Birds/acorn1.png
        frameDuration: 0.2
      wingflap:
        frames:
          - /garden/assets/Birds/acorn1.png
          - /garden/assets/Birds/acorn2.png
        frameDuration: 0.08
      peck:
        frames:
          - /garden/assets/Birds/acorn1.png
        frameDuration: 0.1
    stages:
      - { src: /garden/assets/Birds/acorn1.png, hopEnabled: true, replace: true }
  blue_bird:
    name: Blue bird
    mode: birdAmbient
    scaleWithStage: false
    unlockImage: /garden/assets/Birds/Blue/b1.png
    behavior:
      hopIntervalSec: { min: 3, max: 9 }
      wingflapChance: 0.35
      peckChance: 0.6
      flyChance: 0
      idleFrame: 0
    animations:
      idle:
        frames:
          - /garden/assets/Birds/Blue/b1.png
        frameDuration: 0.2
      wingflap:
        frames:
          - /garden/assets/Birds/Blue/b5.png
          - /garden/assets/Birds/Blue/b7.png
          - /garden/assets/Birds/Blue/b8.png
          - /garden/assets/Birds/Blue/b9.png
          - /garden/assets/Birds/Blue/b10.png
        frameDuration: 0.08
      peck:
        frames:
          - /garden/assets/Birds/Blue/b1.png
          - /garden/assets/Birds/Blue/b2.png
          - /garden/assets/Birds/Blue/b3.png
          - /garden/assets/Birds/Blue/b4.png
        frameDuration: 0.1
    stages:
      - { src: /garden/assets/Birds/Blue/b1.png, hopEnabled: true, replace: true }

  titmouse_bird:
    name: Titmouse
    mode: birdAmbient
    scaleWithStage: false
    unlockImage: /garden/assets/Birds/Titmouse/titmouse1.png
    behavior:
      hopIntervalSec: { min: 3, max: 6 }
      hopNormPerSec: 0.12
      wingflapChance: 0.55
      peckChance: 0.6
      flyChance: 0.3
      idleFrame: 0
    animations:
      idle:
        frames:
          - /garden/assets/Birds/Titmouse/titmouse1.png
        frameDuration: 0.2
      wingflap:
        frames:
          - /garden/assets/Birds/Titmouse/titmouse1.png
          - /garden/assets/Birds/Titmouse/titmouse3.png
          - /garden/assets/Birds/Titmouse/titmouse4.png
          - /garden/assets/Birds/Titmouse/titmouse5.png
          - /garden/assets/Birds/Titmouse/titmouse6.png
          - /garden/assets/Birds/Titmouse/titmouse7.png
          - /garden/assets/Birds/Titmouse/titmouse8.png
        frameDuration: 0.05
      peck:
        frames:
          - /garden/assets/Birds/Titmouse/titmouse8.png
          - /garden/assets/Birds/Titmouse/titmouse9.png
          - /garden/assets/Birds/Titmouse/titmouse10.png
          - /garden/assets/Birds/Titmouse/titmouse9.png
        frameDuration: 0.1
    stages:
      - { src: /garden/assets/Birds/Titmouse/titmouse1.png, hopEnabled: true, replace: true }

  duckling:
    name: Duckling
    mode: birdAmbient
    scaleWithStage: false
    unlockImage: /garden/assets/Birds/Duckling/d1.png
    behavior:
      hopIntervalSec: { min: 1, max: 3 }
      hopNormPerSec: 0.12
      wingflapChance: 0.3
      peckChance: 0.6
      idleFrame: 0
    animations:
      idle:
        frames:
          - /garden/assets/Birds/Duckling/d1.png
        frameDuration: 0.2
      wingflap:
        frames:
          - /garden/assets/Birds/Duckling/d5.png
          - /garden/assets/Birds/Duckling/d6.png
          - /garden/assets/Birds/Duckling/d7.png
          - /garden/assets/Birds/Duckling/d8.png
          - /garden/assets/Birds/Duckling/d7.png
          - /garden/assets/Birds/Duckling/d6.png
        frameDuration: 0.05
      peck:
        frames:
          - /garden/assets/Birds/Duckling/d1.png
          - /garden/assets/Birds/Duckling/d2.png
          - /garden/assets/Birds/Duckling/d3.png
          - /garden/assets/Birds/Duckling/d4.png
          - /garden/assets/Birds/Duckling/d3.png
          - /garden/assets/Birds/Duckling/d2.png
        frameDuration: 0.1
    stages:
      - { src: /garden/assets/Birds/Duckling/d1.png, hopEnabled: true, replace: true }


  moon_bird:
    name: Moon bird
    mode: birdPerch
    unlockImage: /garden/assets/Birds/Moon/moon4.png
    onLevelStart:
      src: /garden/assets/Birds/Moon/moonpost.png
      replace: false
    stages:
      - { src: /garden/assets/Birds/Moon/moon1.png, replace: true, mascotDeliversElement: true }
      - { src: /garden/assets/Birds/Moon/moon2.png, replace: true, mascotDeliversElement: false }
      - { src: /garden/assets/Birds/Moon/moon3.png, replace: true, mascotDeliversElement: false }
      - { src: /garden/assets/Birds/Moon/moon4.png, replace: true, mascotDeliversElement: false }

  sun_bird:
    name: Sun bird
    mode: birdPerch
    unlockImage: /garden/assets/Birds/Sun/sun4.png
    onLevelStart:
      src: /garden/assets/Birds/Sun/sunpost.png
      replace: false
    stages:
      - { src: /garden/assets/Birds/Sun/sun1.png, replace: true, mascotDeliversElement: true }
      - { src: /garden/assets/Birds/Sun/sun2.png, replace: true, mascotDeliversElement: false }
      - { src: /garden/assets/Birds/Sun/sun3.png, replace: true, mascotDeliversElement: false }
      - { src: /garden/assets/Birds/Sun/sun4.png, replace: true, mascotDeliversElement: false }

  pedestal_garden:
    name: Pedestal
    mode: multiStage
    scaleWithStage: false
    unlockImage: /garden/assets/Birds/Pedestal/p1.png
    stages:
      - { src: /garden/assets/Birds/Pedestal/p1.png, replace: false }
      - { src: /garden/assets/Birds/Pedestal/p2.png, replace: false }
      - { src: /garden/assets/Birds/Pedestal/p3.png, replace: false }
      - { src: /garden/assets/Birds/Pedestal/p4.png, replace: false }
      - { src: /garden/assets/Birds/Pedestal/p5.png, replace: false }
      - { src: /garden/assets/Birds/Pedestal/p6.png, replace: false }

  water_garden:
    name: Anhinga pond
    mode: multiStage
    scaleWithStage: false
    unlockImage: /garden/assets/Birds/Hinga/h11.png
    stages:
      - { src: /garden/assets/Birds/Water/w1.png, replace: true }
      - { src: /garden/assets/Birds/Water/w2.png, replace: true }
      - { src: /garden/assets/Birds/Water/w3.png, replace: true }
      - { src: /garden/assets/Birds/Water/w4.png, replace: true }
      - src: /garden/assets/Birds/Water/w5.png
        replace: false
        animation:
          frames:
            - /garden/assets/Birds/Water/w5.png
            - /garden/assets/Birds/Water/w6.png
          frameDuration: 0.3
      - src: /garden/assets/Birds/Hinga/h1.png
        replace: false
        animation:
          frames:
            - /garden/assets/Birds/Hinga/h1.png
            - /garden/assets/Birds/Hinga/h2.png
            - /garden/assets/Birds/Hinga/h3.png
            - /garden/assets/Birds/Hinga/h4.png
            - /garden/assets/Birds/Hinga/h5.png
            - /garden/assets/Birds/Hinga/h6.png
            - /garden/assets/Birds/Hinga/h7.png
            - /garden/assets/Birds/Hinga/h8.png
            - /garden/assets/Birds/Hinga/h9.png
            - /garden/assets/Birds/Hinga/h10.png
            - /garden/assets/Birds/Hinga/h11.png
