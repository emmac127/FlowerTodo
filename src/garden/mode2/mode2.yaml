  #   foodSurfaceId: food_seeds
  #   behavior:
  #     hopIntervalSec: { min: 2, max: 5 }
  #     hopChance: 0.6        # weight for choosing a hop vs wingflap/peck
  #     flyChance: 0.35       # probability of a long hop that uses wingflap
  #     wingflapChance: 0.25  # in-place wingflap (not during a hop)
  #     peckChance: 0.2
  #     idleFrame: 0
  #   animations:
  #     idle:
  #       frames:
  #         - /garden/assets/birds/sparrow-idle.png
  #       frameDuration: 0.2
  #     wingflap:
  #       frames:
  #         - /garden/assets/birds/sparrow-idle.png
  #         - /garden/assets/birds/sparrow-flap1.png
  #         - /garden/assets/birds/sparrow-flap2.png
  #         - /garden/assets/birds/sparrow-idle.png
  #       frameDuration: 0.08
  #     peck:
  #       frames:
  #         - /garden/assets/birds/sparrow-idle.png
  #         - /garden/assets/birds/sparrow-peck1.png
  #         - /garden/assets/birds/sparrow-peck2.png
  #         - /garden/assets/birds/sparrow-idle.png
  #       frameDuration: 0.1
  #   stages:
