# Mode2 (Bird Garden) level definitions
#
# Positions live in layout.yaml; hop/food rectangles in surfaces.yaml.
# Bird collision boxes also live in layout.yaml (see below).
# Edit with the in-app Garden Editor (default app, Mode 2 selected).
#
# --- One bird per level (current levels 2–3) ---
# levels:
#   "2":
#     use: blue_bird
#
# --- Multiple birds on one level ---
# Each bird is one stage: 1st completion → bird 0, 2nd → bird 1, etc.
# Layout slots under birdAmbient.stages ("0", "1", …) match that order.
# Draw collision boxes in the editor (select bird → Draw collision box).
#
# levels:
#   "4":
#     birds:
#       - use: titmouse_bird
#       - use: titmouse_bird
#       - use: titmouse_bird
#
# layout.yaml for level 4:
#   "4":
#     birdAmbient:
#       stages:
#         "0":          # stage 0 — appears after 1st completion on this level
#           x: 0.3
#           y: 0.7
#           scale: 0.4
#           collisionBox:
#             offsetX: -0.02   # left edge relative to bird anchor
#             offsetY: -0.06   # top edge relative to anchor (anchor = bottom-center)
#             width: 0.04
#             height: 0.08
#         "1":          # stage 1 — after 2nd completion
#           x: 0.65
#           y: 0.55
#           collisionBox: { offsetX: -0.018, offsetY: -0.055, width: 0.036, height: 0.07 }
#         "2":          # stage 2 — after 3rd completion
#           x: 0.5
#           y: 0.65

# --- Mascot delivery (per stage) ---
# On any stage entry (stages[], or onLevelStart for perch/planter bases), set
# mascotDeliversElement: false to carry a generic flower instead of that asset.
# Omit or true = mascot carries the real stage image. Default true.

definitions:
  bird_bath:
    name: Bird bath
    mode: multiStage
    scaleWithStage: false
    unlockImage: /garden/assets/Birds/birdfeeder.png
    stages:
      - { src: /garden/assets/Birds/birdfeeder.png, replace: true }

  # --- Example: perch bird (hatches from egg) ---
  # example_perch_bird:
  #   name: Robin on perch
