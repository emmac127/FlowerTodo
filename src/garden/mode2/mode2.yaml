  waterbricks_garden:
    name: Pond bricks
    mode: multiStage
    scaleWithStage: false
    unlockImage: /garden/assets/Birds/Water/w7.png
    stages:
      - { src: /garden/assets/Birds/Water/w7.png, replace: false }
      - { src: /garden/assets/Birds/Water/w8.png, replace: false }
      - { src: /garden/assets/Birds/Water/w9.png, replace: false }
      - { src: /garden/assets/Birds/Water/w10.png, replace: false }
      - { src: /garden/assets/Birds/Water/w11.png, replace: false }
      - { src: /garden/assets/Birds/Water/w12.png, replace: false }
      - { src: /garden/assets/Birds/Water/w13.png, replace: false }

  starbird:
    name: Starbird
    mode: multiStage
    scaleWithStage: false
    unlockImage: /garden/assets/Birds/starbirdframe.png
    stages:
      - { src: /garden/assets/Birds/starbirdframe.png, replace: false }
      - { src: /garden/assets/Birds/starbird.png, replace: false }

  roses:
    name: The Spoonbill Rose
    mode: scatterPerCompletion
    asset: /garden/assets/Birds/roses.png

levels:
  "1":
    birds:
      - use: titmouse_bird
      - use: titmouse_bird
      - use: titmouse_bird
  "2":
    use: pedestal_garden
  "3":
    use: blue_bird
  "4":
    use: moon_bird
  "5":
    use: sun_bird
  "6":
    birds: 
      - use: duckling
      - use: duckling
      - use: duckling
  "7":
    use: water_garden
  "8":
    use: waterbricks_garden
  "9":
    use: starbird
  "10":
    use: roses