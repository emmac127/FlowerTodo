  #   onLevelStart: { src: /garden/assets/birds/perch.png, replace: false }
  #   stages:
  #     - { src: /garden/assets/birds/egg.png, replace: true }
  #     - { src: /garden/assets/birds/hatch1.png, replace: true }
  #     - { src: /garden/assets/birds/hatch2.png, replace: true }
  #     - { src: /garden/assets/birds/robin-idle.png, replace: true }

