# Garden layout positions
#
# Edit these with the in-app Garden Editor (DEV build), then download and paste
# the result here. Coordinates are NORMALIZED to the design canvas:
#   x: 0 = left edge, 1 = right edge of the (scrollable) design canvas
#   y: 0 = top, 1 = ground line (bottom). Assets are anchored bottom-center.
#
# Any slot without an entry is auto-placed until you position it in the editor.

