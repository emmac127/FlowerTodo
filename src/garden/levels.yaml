# Garden level definitions
#
# This file decides WHAT appears in the garden as the player completes tasks.
# Positions live in layout.yaml (edit them with the in-app Garden Editor).
#
# Assets are served from /public, so paths start at the site root, e.g.
#   /garden/assets/Toast1.svg  ->  public/garden/assets/Toast1.svg
#
# Modes:
#   multiStage          One plant per level. In-level score (0 .. stages-1)
#                       picks stages[score]. The number of stages is exactly the
#                       length of the `stages` list below.
#                       `scaleWithStage: true` (default) grows taller each stage;
#                       set `false` to keep a constant size (e.g. dragon_flower).
#                       Level-up happens after (stages - 1) task completions
#                       (7 stages → 6 completions in that level).
#   scatterPerCompletion  Each completion adds one flower at scatter[slot].
#                       Use `asset` (one image for all) or `scatterAssets` (per
#                       slot). Both support `animation` with a `frames` list.
#   planter             Score 0 places `onLevelStart`; each later completion adds
#                       one `perCompletion` fill flower (up to `max`).
#   planterSequence     Like planter, but each fill slot uses its own asset from
#                       the `fills` list (in order). Repeats are fine. The level
#                       length equals the number of `fills` entries.
#
# Animated assets (any stage, fill, scatter asset, or planter base):
#   Add an `animation` block with `frames` (PNG paths in order) and optional
#   `frameDuration` (seconds per frame, default 0.15). Use `src` for a static
#   fallback or omit it to use the first frame.
#
#   Example — animated final growth stage:
#     stages:
#       - { src: /garden/assets/sprout.png, replace: true }
#       - src: /garden/assets/bloom1.png
#         replace: true
#         animation:
#           frames:
#             - /garden/assets/bloom1.png
#             - /garden/assets/bloom2.png
#             - /garden/assets/bloom3.png
#           frameDuration: 0.2
#
#   Example — animated planter fill:
#     fills:
#       - src: /garden/assets/fairyA.png
#         animation:
#           frames:
#             - /garden/assets/fairyA.png
#             - /garden/assets/fairyB.png
#
#   Example — every scattered flower uses the same looping animation:
#     asset:
#       src: /garden/assets/Tulip.png
#       animation:
#         frames:
#           - /garden/assets/Tulip.png
#           - /garden/assets/Tulip2.png
#         frameDuration: 0.2
#
#   Example — different asset (and optional animation) per scatter slot:
#     scatterAssets:
#       - /garden/assets/Tulip.png
#       - src: /garden/assets/Daisy.png
#         animation:
#           frames:
#             - /garden/assets/Daisy.png
#             - /garden/assets/Daisy2.png
#
# In layout.yaml, optional `animationLastFrameHold` (seconds, decimals OK) on a
# slot pauses on the last frame before the loop restarts (requires animation).

definitions:
  toastflower:
    name: Toast flower
    mode: multiStage
    stages:
      - { src: /garden/assets/toast-sprout.svg, replace: true }
      - { src: /garden/assets/Toast1.svg, replace: true }
      - { src: /garden/assets/Toast2.svg, replace: true }
      - { src: /garden/assets/Toast3.svg, replace: true }
      - { src: /garden/assets/Toast4.svg, replace: true }
      - { src: /garden/assets/Toast4.svg, replace: true }

  heartflower:
    name: Heart flower
    mode: scatterPerCompletion
    asset:
       src: /garden/assets/Shinyheart/heart1.png
       animation:
         frames:
           - /garden/assets/Shinyheart/heart1.png
           - /garden/assets/Shinyheart/heart2.png
           - /garden/assets/Shinyheart/heart3.png
           - /garden/assets/Shinyheart/heart4.png
           - /garden/assets/Shinyheart/heart5.png
           - /garden/assets/Shinyheart/heart6.png
           - /garden/assets/Shinyheart/heart7.png
           - /garden/assets/Shinyheart/heart8.png
         frameDuration: 0.2
         animationLastFrameHold: 1.5

  tallflower:
    name: Tall flower
    mode: scatterPerCompletion
    asset:
       src: /garden/assets/Tallone/t1.png
       animation:
         frames:
           - /garden/assets/Tallone/t1.png
           - /garden/assets/Tallone/t2.png
           - /garden/assets/Tallone/t3.png
           - /garden/assets/Tallone/t2.png
           - /garden/assets/Tallone/t1.png
         frameDuration: 0.2
         animationLastFrameHold: 1.5


  poppyflower:
    name: Poppy flower
    mode: scatterPerCompletion
    scatterAssets:
       - /garden/assets/Poppy/p1.png
       - /garden/assets/Poppy/p2.png
       - /garden/assets/Poppy/p1.png
       - /garden/assets/Poppy/p2.png
       - /garden/assets/Poppy/p1.png
       - /garden/assets/Poppy/p2.png


  iceflower:
    name: Ice flower
    mode: scatterPerCompletion
    asset:
      src: /garden/assets/Iceflower/i1.png
      animation:
        frames:
          - /garden/assets/Iceflower/i1.png
          - /garden/assets/Iceflower/i2.png
          - /garden/assets/Iceflower/i3.png
          - /garden/assets/Iceflower/i4.png
          - /garden/assets/Iceflower/i5.png
          - /garden/assets/Iceflower/i6.png
          - /garden/assets/Iceflower/i7.png
        frameDuration: 0.2

  pathway:
    name: Pathway
    mode: multiStage
    scaleWithStage: false
    stages:
      - { src: /garden/assets/Path/Path1.png, replace: true }
      - { src: /garden/assets/Path/Path2.png, replace: true }
      - { src: /garden/assets/Path/Path3.png, replace: true }
      - { src: /garden/assets/Path/Path4.png, replace: true }
      - { src: /garden/assets/Path/Path5.png, replace: true }
      - { src: /garden/assets/Path/Path6.png, replace: true }
      - { src: /garden/assets/Path/Path7.png, replace: true }

  statue:
    name: Statue
    mode: multiStage
    scaleWithStage: false
    stages:
      - { src: /garden/assets/Statue/Statue1.png, replace: true }
      - { src: /garden/assets/Statue/Statue2.png, replace: true }
      - { src: /garden/assets/Statue/Statue3.png, replace: true }
      - { src: /garden/assets/Statue/Statue4.png, replace: true }
      - { src: /garden/assets/Statue/Statue5.png, replace: true }
      - { src: /garden/assets/Statue/Statue6.png, replace: true }

  dragon_flower:
    name: Dragon Flower
    mode: multiStage
    scaleWithStage: false
    stages:
      - { src: /garden/assets/Dragonslice/slice1.png, replace: true }
      - { src: /garden/assets/Dragonslice/slice2.png, replace: true }
      - { src: /garden/assets/Dragonslice/slice3.png, replace: true }
      - { src: /garden/assets/Dragonslice/slice4.png, replace: true }

  # Placeholder until dedicated single-flower art is added.
  tulip_scatter:
    name: Scattered tulips
    mode: scatterPerCompletion
    asset: /garden/assets/Tulip.png

  daisy:
    name: Scattered daisies
    mode: scatterPerCompletion
    asset: /garden/assets/Daisy.png

  fenceposts:
    name: Fence posts
    mode: scatterPerCompletion
    asset: /garden/assets/Fencepost.png

  petunia:
    name: Petunia
    mode: scatterPerCompletion
    asset: /garden/assets/Bluepetunia.png

  # Placeholder planter: a base image plus the same fill flower per completion.
  catgrass_planter:
    name: Flower planter
    mode: planter
    onLevelStart: { src: /garden/assets/Toast4.svg, replace: false }
    perCompletion: { src: /garden/assets/Toast1.svg, replace: false, max: 5 }

  # Planter with a different fill asset per completion (repeats allowed).
  fairies_planter:
    name: Fairy Planter
    mode: planterSequence
    onLevelStart: { src: /garden/assets/Fairies/fairies1.png, replace: false }
    fills:
      - { src: /garden/assets/Fairies/fairies2.png }
      - { src: /garden/assets/Fairies/fairies3.png }
      - { src: /garden/assets/Fairies/fairies4.png }

  lemon_planter:
    name: Lemon Planter
    mode: planterSequence
    onLevelStart: { src: /garden/assets/Lemonyplanter/l1.png, replace: false }
    fills:
      - { src: /garden/assets/Lemonyplanter/normf.png }
      - src: /garden/assets/Lemonyplanter/l2.png.png
        animation:
          frames:
            - /garden/assets/Lemonyplanter/l2.png.png
            - /garden/assets/Lemonyplanter/l3.png.png
            - /garden/assets/Lemonyplanter/l4.png.png
            - /garden/assets/Lemonyplanter/l3.png.png
      - { src: /garden/assets/Lemonyplanter/l4.png.png }
      - src: /garden/assets/Lemonyplanter/l2.png.png
        animation:
          frames:
            - /garden/assets/Lemonyplanter/l2.png.png
            - /garden/assets/Lemonyplanter/l3.png.png
            - /garden/assets/Lemonyplanter/l4.png.png
            - /garden/assets/Lemonyplanter/l3.png.png

  fire_planter:
    name: Fire Planter
    mode: planterSequence
    onLevelStart: { src: /garden/assets/fireflar/planter.png, replace: false }
    fills:
      - src: /garden/assets/fireflar/f1.png
        animation:
          frames:
            - /garden/assets/fireflar/f1.png
            - /garden/assets/fireflar/f2.png
            - /garden/assets/fireflar/f3.png
            - /garden/assets/fireflar/f4.png
            - /garden/assets/fireflar/f5.png
            - /garden/assets/fireflar/f6.png
            - /garden/assets/fireflar/f7.png
          animationLastFrameHold: 1.5
      - src: /garden/assets/fireflar/f1.png
        animation:
          frames:
            - /garden/assets/fireflar/f1.png
            - /garden/assets/fireflar/f2.png
            - /garden/assets/fireflar/f3.png
            - /garden/assets/fireflar/f4.png
            - /garden/assets/fireflar/f5.png
            - /garden/assets/fireflar/f6.png
            - /garden/assets/fireflar/f7.png
          animationLastFrameHold: 1.5
      - src: /garden/assets/fireflar/f1.png
        animation:
          frames:
            - /garden/assets/fireflar/f1.png
            - /garden/assets/fireflar/f2.png
            - /garden/assets/fireflar/f3.png
            - /garden/assets/fireflar/f4.png
            - /garden/assets/fireflar/f5.png
            - /garden/assets/fireflar/f6.png
            - /garden/assets/fireflar/f7.png
          animationLastFrameHold: 1.5
      - src: /garden/assets/fireflar/f1.png
        animation:
          frames:
            - /garden/assets/fireflar/f1.png
            - /garden/assets/fireflar/f2.png
            - /garden/assets/fireflar/f3.png
            - /garden/assets/fireflar/f4.png
            - /garden/assets/fireflar/f5.png
            - /garden/assets/fireflar/f6.png
            - /garden/assets/fireflar/f7.png
          animationLastFrameHold: 1.5

# One entry per garden level. `use:` references a definition above.
# (You can also inline `mode:` + its fields directly under a level.)
levels:
  "1":
    use: petunia
  "2":
    use: fairies_planter
  "3":
    use: lemon_planter
  "4":
    use: tulip_scatter
  "5":
    use: fenceposts
  "6":
    use: fenceposts
  "7":
    use: tulip_scatter
  "8":
    use: dragon_flower
  "9":
    use: pathway
  "10":
    use: daisy
  "11":
    use: statue
  "12":
    use: heartflower
  "13":
    use: fire_planter
  "14":
    use: iceflower
  "15":
    use: poppyflower
  "16":
    use: tallflower
