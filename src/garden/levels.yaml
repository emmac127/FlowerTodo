# Garden level definitions
#
# This file decides WHAT appears in the garden as the player completes tasks.
# Positions live in layout.yaml (edit them with the in-app Garden Editor).
#
# Assets are served from /public, so paths start at the site root, e.g.
#   /garden/assets/Toast1.svg  ->  public/garden/assets/Toast1.svg
#
# Modes:
#   multiStage          One plant per level. In-level score (0 .. stages-1)
#                       picks stages[score]. The number of stages is exactly the
#                       length of the `stages` list below.
#                       `scaleWithStage: true` (default) grows taller each stage;
#                       set `false` to keep a constant size (e.g. dragon_flower).
#                       Level-up happens after (stages - 1) task completions
#                       (7 stages → 6 completions in that level).
#   scatterPerCompletion  Each completion within the level adds one new flower,
#                       placed at layout.levels."N".scatter[slot].
#   planter             Score 0 places `onLevelStart`; each later completion adds
#                       one `perCompletion` fill flower (up to `max`).

definitions:
  toastflower:
    name: Toast flower
    mode: multiStage
    stages:
      - { src: /garden/assets/toast-sprout.svg, replace: true }
      - { src: /garden/assets/Toast1.svg, replace: true }
      - { src: /garden/assets/Toast2.svg, replace: true }
      - { src: /garden/assets/Toast3.svg, replace: true }
      - { src: /garden/assets/Toast4.svg, replace: true }
      - { src: /garden/assets/Toast4.svg, replace: true }

  pathway:
    name: Pathway
    mode: multiStage
    scaleWithStage: false
    stages:
      - { src: /garden/assets/Path/Path1.png, replace: true }
      - { src: /garden/assets/Path/Path2.png, replace: true }
      - { src: /garden/assets/Path/Path3.png, replace: true }
      - { src: /garden/assets/Path/Path4.png, replace: true }
      - { src: /garden/assets/Path/Path5.png, replace: true }
      - { src: /garden/assets/Path/Path6.png, replace: true }
      - { src: /garden/assets/Path/Path7.png, replace: true }

  statue:
    name: Statue
    mode: multiStage
    scaleWithStage: false
    stages:
      - { src: /garden/assets/Statue/Statue1.png, replace: true }
      - { src: /garden/assets/Statue/Statue2.png, replace: true }
      - { src: /garden/assets/Statue/Statue3.png, replace: true }
      - { src: /garden/assets/Statue/Statue4.png, replace: true }
      - { src: /garden/assets/Statue/Statue5.png, replace: true }
      - { src: /garden/assets/Statue/Statue6.png, replace: true }

  dragon_flower:
    name: Dragon Flower
    mode: multiStage
    scaleWithStage: false
    stages:
      - { src: /garden/assets/Dragonslice/slice1.png, replace: true }
      - { src: /garden/assets/Dragonslice/slice2.png, replace: true }
      - { src: /garden/assets/Dragonslice/slice3.png, replace: true }
      - { src: /garden/assets/Dragonslice/slice4.png, replace: true }

  # Placeholder until dedicated single-flower art is added.
  tulip_scatter:
    name: Scattered tulips
    mode: scatterPerCompletion
    asset: /garden/assets/Tulip.png

  daisy:
    name: Scattered daisies
    mode: scatterPerCompletion
    asset: /garden/assets/Daisy.png

  fenceposts:
    name: Fence posts
    mode: scatterPerCompletion
    asset: /garden/assets/Fencepost.png

  # Placeholder planter: a base image plus fill flowers per completion.
  catgrass_planter:
    name: Flower planter
    mode: planter
    onLevelStart: { src: /garden/assets/Toast4.svg, replace: false }
    perCompletion: { src: /garden/assets/Toast1.svg, replace: false, max: 5 }

# One entry per garden level. `use:` references a definition above.
# (You can also inline `mode:` + its fields directly under a level.)
levels:
  "1":
    use: toastflower
  "2":
    use: toastflower
  "3":
    use: tulip_scatter
  "4":
    use: fenceposts
  "5":
    use: fenceposts
  "6":
    use: tulip_scatter
  "7":
    use: dragon_flower
  "8":
    use: pathway
  "9":
    use: daisy
  "10":
    use: statue
